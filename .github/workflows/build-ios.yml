name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-xcode:
    name: Build IPA from exported Xcode project
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS objects are hydrated
        run: git lfs checkout

      - name: Locate Xcode Project
        id: find-project
        run: |
          XCODEPROJ=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then
            echo "::error::No .xcodeproj found in repository. Please export Unity to iOS and commit the Xcode project, or see GITHUB_SIDELOAD.md."
            exit 1
          fi
          echo "Found project: $XCODEPROJ"
          PROJECT_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "project_path=$XCODEPROJ" >> $GITHUB_OUTPUT
          echo "scheme=Unity-iPhone" >> $GITHUB_OUTPUT

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then echo "::error::No Xcode installation found"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iPhoneOS'

      - name: Add HaishinKit Swift Package
        run: |
          python3 Tools/add_haishinkit_spm.py "${{ steps.find-project.outputs.project_path }}"
          xcodebuild -resolvePackageDependencies -project "${{ steps.find-project.outputs.project_path }}" -scheme "Unity-iPhone"

      - name: Build unsigned app
        env:
          XCODE_PROJECT: ${{ steps.find-project.outputs.project_path }}
        run: |
          set -euo pipefail
          PROJECT_DIR=$(dirname "$XCODE_PROJECT")
          cat > "$PROJECT_DIR/Podfile" <<'PODFILE'
          platform :ios, '15.0'
          use_frameworks! :linkage => :static

          target 'UnityFramework' do
            pod 'MediaPipeTasksVision'
          end
          PODFILE
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          ruby Tools/add_ios_native_pose.rb "$XCODE_PROJECT" Assets/Plugins/iOS/NativePoseBridge.mm
          (cd "$PROJECT_DIR" && pod install --repo-update --silent)
          WORKSPACE="${XCODE_PROJECT%.xcodeproj}.xcworkspace"
          test -d "$WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/App" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          if find "$RUNNER_TEMP/App" -name 'MediaPipeUnity.framework' -print -quit | grep -q .; then
            echo "::error::Legacy MediaPipeUnity.framework was embedded alongside MediaPipeTasksVision"
            exit 1
          fi

      - name: Package IPA
        run: |
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH=$(find "$RUNNER_TEMP/App" -name "*.app" | head -n 1)
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload MyProject5-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyProject5-unsigned-ipa
          path: ${{ runner.temp }}/MyProject5-unsigned.ipa
          if-no-files-found: error
