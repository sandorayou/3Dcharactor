name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-xcode:
    name: Build IPA from exported Xcode project
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            .github/workflows
            .gitattributes
            Builds/iOS-WindowsPort.zip
            /Tools/PrivacyAudit/
            /Assets/Plugins/iOS/PrivacyMosaicCore.h
            /Assets/Plugins/iOS/NativePoseBridge.mm
            /Assets/Plugins/iOS/IOSLiveStreaming.swift
            /Tools/LiveStreamingSmoke/
            /Tools/IOSExportPatch/
          sparse-checkout-cone-mode: false

      - name: Ensure Git LFS objects are hydrated
        run: git lfs pull --include="Builds/iOS-WindowsPort.zip" --exclude=""

      - name: Extract iOS-only Xcode export
        run: |
          set -euo pipefail
          test -f Builds/iOS-WindowsPort.zip
          mkdir -p Builds/iOS-WindowsPort
          ditto -x -k Builds/iOS-WindowsPort.zip Builds/iOS-WindowsPort
          cp Assets/Plugins/iOS/NativePoseBridge.mm Builds/iOS-WindowsPort/Libraries/Plugins/iOS/NativePoseBridge.mm
          cmp Assets/Plugins/iOS/NativePoseBridge.mm Builds/iOS-WindowsPort/Libraries/Plugins/iOS/NativePoseBridge.mm
          python3 Tools/IOSExportPatch/patch_export.py Builds/iOS-WindowsPort

      - name: Locate Xcode Project
        id: find-project
        run: |
          XCODEPROJ="Builds/iOS-WindowsPort/Unity-iPhone.xcodeproj"
          if [ ! -d "$XCODEPROJ" ]; then
            echo "::error::Export the current Unity iOS player to Builds/iOS-WindowsPort first."
            exit 1
          fi
          test "$(cat Builds/iOS-WindowsPort/windows-port-export.txt)" = "WindowsPort-PoseHandFace-Mosaic-v1"
          echo "Found project: $XCODEPROJ"
          PROJECT_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "project_path=$XCODEPROJ" >> $GITHUB_OUTPUT
          echo "scheme=Unity-iPhone" >> $GITHUB_OUTPUT

      - name: Select Xcode
        run: |
          # Swift 6.2.4 crashes in HaishinKit's MixerNode optimization. Keep the
          # app and transport verification on this installed, fixed toolchain.
          XCODE_PATH=/Applications/Xcode_16.4.app
          if [ ! -d "$XCODE_PATH" ]; then echo "::error::Required Xcode 16.4 is unavailable"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iPhoneOS'

      - name: Audit Windows and native privacy parity
        run: |
          set -euo pipefail
          sed 's/\r$//' Assets/Plugins/iOS/PrivacyMosaicCore.h > "$RUNNER_TEMP/privacy-source.h"
          sed 's/\r$//' Builds/iOS-WindowsPort/Libraries/Plugins/iOS/PrivacyMosaicCore.h > "$RUNNER_TEMP/privacy-export.h"
          cmp "$RUNNER_TEMP/privacy-source.h" "$RUNNER_TEMP/privacy-export.h"
          clang++ -std=c++14 -O2 Tools/PrivacyAudit/audit.cpp -o "$RUNNER_TEMP/privacy-audit"
          "$RUNNER_TEMP/privacy-audit" Tools/PrivacyAudit/cases
          clang++ -std=c++14 -fobjc-arc Tools/PrivacyAudit/audit_core_image.mm -framework Foundation -framework CoreImage -framework CoreVideo -framework CoreGraphics -o "$RUNNER_TEMP/privacy-colour-audit"
          "$RUNNER_TEMP/privacy-colour-audit" Tools/PrivacyAudit/cases/case0.bgra

      - name: Build unsigned app
        env:
          XCODE_PROJECT: ${{ steps.find-project.outputs.project_path }}
        run: |
          set -euo pipefail
          PROJECT_DIR=$(dirname "$XCODE_PROJECT")
          test -f "$PROJECT_DIR/Podfile"
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

          test -f "$PROJECT_DIR/Libraries/Plugins/iOS/NativePoseBridge.mm"
          test -f "$PROJECT_DIR/Libraries/Plugins/iOS/IOSScreenRecording.mm"
          (cd "$PROJECT_DIR" && pod install --repo-update --silent)
          WORKSPACE="${XCODE_PROJECT%.xcodeproj}.xcworkspace"
          test -d "$WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/App" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            GCC_OPTIMIZATION_LEVEL=s \
            STRIP_INSTALLED_PRODUCT=YES \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            clean build
          if find "$RUNNER_TEMP/App" -name 'MediaPipeUnity.framework' -print -quit | grep -q .; then
            echo "::error::Legacy MediaPipeUnity.framework was embedded alongside MediaPipeTasksVision"
            exit 1
          fi

      - name: Verify three simultaneous RTMP outputs
        run: |
          set -euo pipefail
          brew install mediamtx ffmpeg
          python3 Tools/LiveStreamingSmoke/run.py

      - name: Upload streaming verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-streaming-verification
          path: Output/live-streaming-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Package IPA
        run: |
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH=$(find "$RUNNER_TEMP/App" -name "*.app" | head -n 1)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "MyProject5"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.sandorayou.myproject5"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          du -sh "$APP_PATH"
          find "$RUNNER_TEMP/Payload" -name '*.dSYM' -type d -prune -exec rm -rf {} +
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload MyProject5-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyProject5-unsigned-ipa
          path: ${{ runner.temp }}/MyProject5-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
